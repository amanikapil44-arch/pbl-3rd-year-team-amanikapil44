services:
  web:
    build: .
    command: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:5000 app:app
    ports:
      - "${PORT:-5000}:5000"
    environment:
      CLOUDFLOW_SECRET_KEY: ${CLOUDFLOW_SECRET_KEY:?Set CLOUDFLOW_SECRET_KEY in .env}
      CLOUDFLOW_DB: /data/cloudflow.db
    volumes: ["cloudflow_data:/data"]
    depends_on: [scheduler]
  scheduler:
    build: .
    command: python scheduler.py
    environment:
      CLOUDFLOW_SECRET_KEY: ${CLOUDFLOW_SECRET_KEY:?Set CLOUDFLOW_SECRET_KEY in .env}
      CLOUDFLOW_DB: /data/cloudflow.db
    volumes: ["cloudflow_data:/data"]
volumes:
  cloudflow_data:
